name: Build Resume PDFs

on:
  push:
    branches: [main]
    paths:
      - "resume.tex"
      - "resume-zh.tex"
      - "resume.cls"
      - "selfie.png"
      - "Makefile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-plain-generic \
            fonts-noto-cjk \
            fonts-font-awesome
          sudo fc-cache -fv

      - name: Build English PDF
        run: make en

      - name: Build Chinese PDF
        run: make zh

      - name: Name downloadable PDFs
        run: |
          cp resume-en.pdf Qingliu-Wu-Resume.pdf
          cp resume-zh.pdf 吴清柳-简历-17353675760.pdf

      # Single-file artifacts download as the PDF itself; a multi-file
      # artifact is always zipped by GitHub.
      - name: Upload English PDF
        uses: actions/upload-artifact@v4
        with:
          name: Qingliu-Wu-Resume
          path: Qingliu-Wu-Resume.pdf
          if-no-files-found: error

      - name: Upload Chinese PDF
        uses: actions/upload-artifact@v4
        with:
          name: 吴清柳-简历-17353675760
          path: 吴清柳-简历-17353675760.pdf
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            resume-en.log
            resume-zh.log
